openapi: 3.1.0
info:
  title: Simc Api
  version: 1.0.0
servers:
  - url: "https://simc.yggdrasil.home"
  - url: "http://simc.k3d.localhost"
paths:
  /api/profile:
    post:
      description: Parse a simulationcraft profile
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                type: object
        "400":
          description: bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
