# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

includes:
  cluster:
    taskfile: .cluster/Taskfile.yaml
    dir: .cluster
  backend:
    taskfile: backend/Taskfile.yaml
    dir: backend
  chart:
    taskfile: chart/Taskfile.yml
    dir: chart
tasks:
  install-deps:
    desc: Install development dependencies
    cmds:
      - brew install kubectl k3d helm istioctl golangci-lint kubeconform nats-io/nats-tools/nats

  run-simc:
    desc: "Run simc directly via Docker, writes JSON to profiles/results/result.json. Usage: task run-simc -- profiles/sample.simc"
    cmds:
      - |
        mkdir -p profiles/results
        docker run --rm \
          -v "$(realpath {{.CLI_ARGS}}):/input.simc:ro" \
          -v "$(realpath profiles/results):/output" \
          simulationcraftorg/simc:latest \
          /input.simc json2=/output/result.json html=/dev/null
  deploy:
    desc: Deploy the application using Helm
    cmds:
      - helm upgrade --install simc -n simc chart --values overrides-k3d-values.yaml --kube-context k3d-dev-cluster
