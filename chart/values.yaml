fullnameOverride:
nameOverride:

appDefaults:
  image:
    registry: ghcr.io/robertsmj/simc
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  adminPort: 8081
  probes:
    # liveness is the configuration for the platform liveness probe
    liveness:
      # liveness.periodSeconds is the interval of the liveness probe
      periodSeconds: 10
      # liveness.timeoutSeconds is the interval of the liveness probe
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    startup:
      periodSeconds: 1
      timeoutSeconds: 2
      failureThreshold: 30
  env:
    QUEUE_URL: "nats://nats.nats.svc.cluster.local:4222"
    LOG_LEVEL: "INFO"

streams:
  simc-job-stream:
    subjects: ["simc.*"]
    storage: file
    maxAge: 4h
    retention: limits
  # TODO
  # simc-dlq:
  #   subjects:
  #     - $JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.simc-job-stream.*
  #     - $JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.simc-job-stream.*
  #   storage: file
  #   maxAge: 1

gateway:
  hostnames:
  parentRefs:

apps:
  run-sim:
    component: worker
    image:
      repository: run-sim
    replicas: 1
    resources:
      requests:
        memory: 128Mi
        cpu: 1000m
      limits:
        memory: 512Mi
        cpu: 1000m
    consumer:
      streamName: simc-job-stream
      durableName: simc-job-consumer
      filterSubject: simc.job
      maxDeliver: 3
      ackWait: 10s
    # shutdownTailSeconds must cover any in-code shutdown grace period
    shutdownTailSeconds: 10
    maxRuntimeSeconds: 290
    publisher:
      streamName: simc-job-stream
      subject: simc.results
    probes:
      liveness:
        timeoutSeconds: 5
        failureThreshold: 6
  write-result:
    component: db
    image:
      repository: write-result
    consumer:
      streamName: simc-job-stream
      durableName: simc-jobs-results
      filterSubject: simc.results
  api:
    component: api
    image:
      repository: api
    ports:
      http: 8080
    route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
