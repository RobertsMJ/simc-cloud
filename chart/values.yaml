fullnameOverride:
nameOverride:

appDefaults:
  image:
    registry: ghcr.io/robertsmj/simc
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  adminPort: 8081
  probes:
    # liveness is the configuration for the platform liveness probe
    liveness:
      # liveness.periodSeconds is the interval of the liveness probe
      periodSeconds: 10
      # liveness.timeoutSeconds is the interval of the liveness probe
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    startup:
      periodSeconds: 1
      timeoutSeconds: 2
      failureThreshold: 30
  env:
    QUEUE_URL: "nats://nats.nats.svc.cluster.local:4222"
    LOG_LEVEL: "INFO"

# Connection settings for every app with a `scylla` block. An app's `scylla.existingSecret` names the Secret, with
# `username` and `password` keys, that homelab tenant onboarding provisions for the role the app connects as.
scylla:
  hosts:
  keyspace:

# Schema migrations, run as a pre-install/pre-upgrade hook Job
migrate:
  image:
    repository: migrate
  scylla:
    # Keyspace owner role, for schema changes; only the migrate Job uses it
    existingSecret: simc-scylla-owner
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 256Mi
      cpu: 100m

streams:
  simc-stream:
    subjects: ["simc.>"]
    storage: file
    maxAge: 4h
    retention: limits
  # TODO
  # simc-dlq:
  #   subjects:
  #     - $JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.simc-stream.*
  #     - $JS.EVENT.ADVISORY.CONSUMER.MSG_TERMINATED.simc-stream.*
  #   storage: file
  #   maxAge: 1

gateway:
  hostnames:
  parentRefs:

autoscaling:
  natsMonitoringEndpoint: nats-headless.nats.svc.cluster.local:8222

apps:
  target-dummy:
    component: worker
    image:
      repository: target-dummy
    autoscaling:
      minReplicas: 0
      maxReplicas: 4
      lagThreshold: 1
      cooldownPeriod: 30
      pollingInterval: 10
    resources:
      requests:
        memory: 128Mi
        cpu: 1000m
      limits:
        memory: 512Mi
        cpu: 1000m
    # shutdownTailSeconds must cover any in-code shutdown grace period
    shutdownTailSeconds: 10
    maxRuntimeSeconds: 290
    consumer:
      streamName: simc-stream
      durableName: target-dummy
      filterSubject: simc.sims.requested
      maxDeliver: 3
      ackWait: 10s
    publisher:
      farseer:
        streamName: simc-stream
        subject: simc.sims.completed
    probes:
      liveness:
        timeoutSeconds: 5
        failureThreshold: 6
  farseer:
    component: db
    image:
      repository: farseer
    scylla:
      existingSecret: simc-scylla-app
    consumer:
      streamName: simc-stream
      durableName: farseer
      filterSubject: simc.sims.completed
  blacksmith:
    component: worker
    image:
      repository: blacksmith
    consumer:
      streamName: simc-stream
      durableName: blacksmith
      filterSubject: simc.jobs.created
    publisher:
      target-dummy:
        streamName: simc-stream
        subject: simc.sims.requested
  api:
    component: api
    image:
      repository: api
    scylla:
      existingSecret: simc-scylla-app
    ports:
      http: 8080
    route:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
    publisher:
      blacksmith:
        streamName: simc-stream
        subject: simc.jobs.created
