version: "3"

tasks:
  lint:
    desc: Run golangci-lint on the backend codebase
    cmds:
      - golangci-lint run --fast-only
  format:
    desc: Format the backend codebase
    cmds:
      - go fmt ./...
  test:
    desc: Run the backend tests
    cmds:
      - go test ./...
  test:integration:
    desc: Run the backend integration tests
    cmds:
      - go test -tags=integration ./...
  build:
    desc: Build service image
    cmds:
      - docker bake --file docker-bake.hcl
  push:
    desc: Push service image
    cmds:
      - docker bake --file docker-bake.hcl --push
