name: Publish
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "chart/**"
      - ".github/workflows/**"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  backend:
    uses: ./.github/workflows/backend.yaml

  chart:
    uses: ./.github/workflows/chart.yaml

  publish:
    needs: [backend, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Compute versions
        id: version
        run: |
          echo "image=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "chart=$(awk '/^version:/ {print $2}' chart/Chart.yaml)-main.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish images
        run: REGISTRY=ghcr.io/robertsmj/simc TAG="${{ steps.version.outputs.image }}" task backend:push

      - name: Publish chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package chart --version "${{ steps.version.outputs.chart }}" --app-version "${{ steps.version.outputs.image }}"
          helm push "simc-${{ steps.version.outputs.chart }}.tgz" oci://ghcr.io/robertsmj/charts
