name: Backend Integration
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Format
        run: |
          task backend:format
          git diff --exit-code

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

      - name: Test
        run: task backend:test

      - name: Build
        run: task backend:build

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Publish
        run: |
          github_sha_hash=${{ github.sha }}
          github_sha_short="${github_sha_hash:0:7}"
          REGISTRY=ghcr.io/robertsmj/simc TAG="main-${github_sha_short}" task backend:push
