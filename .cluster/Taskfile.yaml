version: "3"

vars:
  HOMELAB_DIR: '{{.HOMELAB_DIR | default (print .ROOT_DIR "/../homelab")}}'

tasks:
  create:
    desc: Create a local k3d cluster for development
    preconditions:
      - sh: test -f {{.HOMELAB_DIR}}/Taskfile.yml
        msg: "homelab checkout not found at {{.HOMELAB_DIR}} (override with HOMELAB_DIR=...)"
    cmds:
      - k3d cluster create --config k3d.yaml
      - task -d {{.HOMELAB_DIR}} bootstrap CLUSTER=k3d-dev-cluster
      - kubectl --context k3d-dev-cluster -n flux-system wait --for=condition=Ready fluxinstance/flux --timeout=5m
      - kubectl --context k3d-dev-cluster -n flux-system wait --for=create kustomization/apps --timeout=5m
      - kubectl --context k3d-dev-cluster -n flux-system wait --for=condition=Ready kustomization/apps --timeout=20m
  delete:
    desc: Destroy the local k3d cluster
    cmds:
      - k3d cluster delete dev-cluster
  port-forward-nats:
    desc: Port forward the NATS service
    cmds:
      - kubectl --context k3d-dev-cluster -n nats port-forward svc/nats 4222:4222
  port-forward-postgres:
    desc: Port forward the Postgres rw service
    cmds:
      - kubectl --context k3d-dev-cluster -n simc port-forward svc/simc-rw 5432:5432
