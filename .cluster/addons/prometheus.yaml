---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: istio-system
spec:
  chart: prometheus
  repo: https://prometheus-community.github.io/helm-charts
  targetNamespace: istio-system
  valuesContent: |-
    alertmanager:
      enabled: false
    server:
      global:
        scrape_interval: 15s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      name: shared-gateway
      kind: Gateway
      namespace: istio-system
  hostnames:
    - "prometheus.k3d.localhost"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: prometheus-server
          port: 80