---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kiali
  namespace: istio-system
spec:
  chart: kiali-operator
  repo: https://kiali.org/helm-charts
  targetNamespace: istio-system
  valuesContent: |-
    cr:
      create: true
      namespace: istio-system
      spec:
        auth:
          strategy: anonymous
        external_services:
          grafana:
            internal_url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            external_url: http://grafana.k3d.localhost
          prometheus:
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            external_url: http://prometheus.k3d.localhost
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      name: shared-gateway
      kind: Gateway
      namespace: istio-system
  hostnames:
    - "kiali.k3d.localhost"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kiali
          port: 20001
      matches:
        - path:
            type: PathPrefix
            value: /
---
