apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: app
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      hostname: "*.k3d.localhost"
      port: 80
      allowedRoutes:
        namespaces:
          from: All
  # TODO: Come back to this once i understand how to configure TLS for local development
  # - name: https
  #   protocol: HTTPS
  #   hostname: "k3d.localhost"
  #   port: 443
  #   allowedRoutes:
  #     namespaces:
  #       from: Same
  #   tls:
  #     mode: Terminate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      name: shared-gateway
      kind: Gateway
      namespace: app
  hostnames:
    - "kiali.k3d.localhost"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: kiali
          port: 20001
      matches:
        - path:
            type: PathPrefix
            value: /
---
